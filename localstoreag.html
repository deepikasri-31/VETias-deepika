<input type="text" id="student">
<button onclick="saveData()">
    Save
</button>
<button onclick="getData()">
    Get Data
</button>
<p id="result"></p>
<script>
    function saveData(){
        let name=
            document.getElementById(
                "stundentName"
            ).value;
    localStorage.setItem(
        "student",
        name
    );
    alert("Data Saved");
}
function getData() {

    let student = 
      localStorage.getItem(
        "student"
      );
      document
      .getElementById("result")
      .innerHTML = student;
}
</script>
